<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"></head><body>
<title>Chialli Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Zilla+Slab:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: banda bordó con el sello de la marca arriba, pestañas de trabajo, y una sola columna de contenido sobre papel crema. */
:root{
  --bg:#FBF6EE; --surface:#FFFFFF; --cream:#F5EBDA; --ink:#2C1A1D; --muted:#7A6563;
  --line:#E8DAC5; --bordo:#A3263A; --bordo-deep:#7B1828; --on-bordo:#FBF1E3; --wheat:#B98A3E;
  --ok:#2F7A4F; --ok-bg:#E3F1E7; --warn:#9A5B00; --warn-bg:#FBEFD6; --bad:#B3261E; --bad-bg:#FBE4E1;
  --up:#B3261E; --down:#2F7A4F; --shadow:0 1px 2px rgba(60,20,25,.06),0 6px 24px rgba(60,20,25,.08);
  --f-brand:"Dancing Script","Brush Script MT",cursive;
  --f-head:"Zilla Slab",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1214; --surface:#251A1D; --cream:#2F2125; --ink:#F3E7DA; --muted:#B9A49E;
  --line:#3E2C30; --bordo:#D8566C; --bordo-deep:#5E1220; --on-bordo:#FBF1E3; --wheat:#D9AE63;
  --ok:#7CCB98; --ok-bg:#1E3527; --warn:#F0B95C; --warn-bg:#3A2C12; --bad:#FF8A80; --bad-bg:#3D1C1A;
  --up:#FF8A80; --down:#7CCB98; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1214; --surface:#251A1D; --cream:#2F2125; --ink:#F3E7DA; --muted:#B9A49E;
  --line:#3E2C30; --bordo:#D8566C; --bordo-deep:#5E1220; --on-bordo:#FBF1E3; --wheat:#D9AE63;
  --ok:#7CCB98; --ok-bg:#1E3527; --warn:#F0B95C; --warn-bg:#3A2C12; --bad:#FF8A80; --bad-bg:#3D1C1A;
  --up:#FF8A80; --down:#7CCB98; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-head);font-weight:600;text-wrap:balance;margin:0}
h2{font-size:1.5rem}
h3{font-size:1.15rem}

/* Encabezado */
.top{background:var(--bordo-deep);background:linear-gradient(180deg,#8E1E30,#7B1828);color:var(--on-bordo);padding-block:14px 0;padding-inline:16px}
.top-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.seal{display:inline-flex;flex-direction:column;align-items:center;padding:4px 22px 6px;border:1.5px solid rgba(251,241,227,.65);border-radius:40px/50%;outline:3px solid rgba(251,241,227,.18);outline-offset:3px;line-height:1}
.seal b{font-family:var(--f-brand);font-size:2.1rem;font-weight:700;letter-spacing:.5px}
.seal small{font-family:var(--f-head);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;margin-top:2px}
.top-meta{flex:1;min-width:200px}
.top-meta .t{font-family:var(--f-head);font-size:1.1rem}
.top-meta .s{opacity:.8;font-size:.9rem}
.chip-store{font-size:.8rem;border:1px solid rgba(251,241,227,.4);border-radius:99px;padding:3px 10px;white-space:nowrap}
.tabs{max-width:1180px;margin:12px auto 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;color:var(--on-bordo);opacity:.78;padding:10px 16px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:500;white-space:nowrap}
.tabs button:hover{opacity:1}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);opacity:1;font-weight:700}
.tabs .cnt{font-size:.75rem;opacity:.7;margin-left:4px}

main{max-width:1180px;margin:0 auto;padding-block:22px 60px;padding-inline:16px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.lead{color:var(--muted);max-width:68ch;margin:4px 0 0}

/* Controles */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--bordo)}
.btn.pri{background:var(--bordo);border-color:var(--bordo);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#1B1214}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#1B1214}}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--bordo)}
.btn.danger{color:var(--bad);border-color:var(--bad-bg)}
.btn.sm{padding:4px 10px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--bordo);outline-offset:2px}
.in,select.in,textarea.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.in:focus{border-color:var(--bordo);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--bordo) 20%,transparent)}
.search{flex:1;min-width:180px;max-width:360px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500}
label.f .in{color:var(--ink);font-size:1rem}

/* Resumen */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat .v{font-family:var(--f-head);font-size:1.6rem;font-weight:600;margin-top:2px}
.stat .d{font-size:.85rem;color:var(--muted)}

/* Tablas */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--cream);white-space:nowrap}
th:first-child{border-top-left-radius:var(--r)} th:last-child{border-top-right-radius:var(--r)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--cream) 45%,transparent)}
td.r,th.r{text-align:right}
.name{font-weight:700}
.sub{font-size:.85rem;color:var(--muted)}
.price-in{width:110px;text-align:right}
.money{position:relative;display:inline-flex;align-items:center}
.money>i{position:absolute;left:10px;font-style:normal;color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums}
.money>.in{padding-left:26px}
label.f .money{display:flex}.money>.in{width:100%}
td .money>.in{width:120px}
tr.sel td{background:color-mix(in srgb,var(--bordo) 8%,transparent)}
.clickable{cursor:pointer}
.clickable:hover .name{color:var(--bordo);text-decoration:underline}

.pill{display:inline-block;font-size:.78rem;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neu{background:var(--cream);color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)}

/* Barra de acción masiva */
.bulk{position:sticky;bottom:12px;z-index:5;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.bulk .in{background:var(--bg);color:var(--ink);width:90px}
.bulk .btn{background:var(--bg);color:var(--ink);border-color:transparent}
.bulk .btn.pri{background:var(--bordo);color:#fff}
.seg{display:inline-flex;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
.seg button{background:none;border:0;color:inherit;padding:6px 10px;cursor:pointer;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:700}

/* Vacío */
.empty{padding:36px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty p{color:var(--muted);max-width:52ch;margin:0}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(30,10,14,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.md{background:var(--bg);border-radius:14px;width:min(900px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
.md-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.md-b{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.md-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid.g2{grid-template-columns:2fr 1fr}
@media (max-width:560px){.grid.g2{grid-template-columns:1fr}}
.items td{padding:6px 6px}
.items .in{width:100%}
.items table{min-width:560px}
.calc{background:var(--cream);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.calc .k{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.calc .v{font-family:var(--f-head);font-size:1.35rem;font-weight:600}
.calc .v.big{color:var(--bordo);font-size:1.7rem}
.note{font-size:.9rem;color:var(--muted)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:.92rem}
.okbox{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:8px 12px;font-size:.92rem}

/* Importar */
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;background:var(--surface);display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.over{border-color:var(--bordo);background:var(--cream)}
.drop .big{font-family:var(--f-head);font-size:1.2rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.orig{font-size:.85rem;color:var(--muted);font-style:italic}

.rubro{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.prov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.prov{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--bg)}
.prov:hover{border-color:var(--bordo)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer;background:var(--surface)}
.chip:has(input:checked){border-color:var(--bordo);background:color-mix(in srgb,var(--bordo) 10%,transparent)}
.alert{background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.alert b{color:var(--warn)}
.alert-list{display:flex;flex-wrap:wrap;gap:6px}
.stock-in{width:84px;text-align:right}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:middle}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:620px){.choice{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--surface)}
.opt.on{border-color:var(--bordo);background:color-mix(in srgb,var(--bordo) 7%,var(--surface))}
.opt input{margin-top:4px;accent-color:var(--bordo)}
tr.dim td{opacity:.55}
a.btn{text-decoration:none}
.msg{white-space:pre-wrap;background:var(--cream);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:.92rem;margin:6px 0 0}
.lista-cols{grid-template-columns:300px 1fr}
@media (max-width:760px){.lista-cols{grid-template-columns:1fr}}
#hoja-slot{min-width:0}
.hoja{background:#FFFDF8;color:#2C1A1D;border:1px solid #E8DAC5;border-radius:12px;padding:28px 30px;max-width:640px;font-family:"Alegreya Sans",system-ui,sans-serif;box-shadow:0 6px 24px rgba(60,20,25,.08)}
.hoja-h{display:flex;gap:18px;align-items:center;border-bottom:2px solid #A3263A;padding-bottom:14px;margin-bottom:10px}
.hoja .seal.small{background:#8E1E30;color:#FBF1E3;padding:4px 18px 6px;border-radius:40px/50%;display:inline-flex;flex-direction:column;align-items:center;line-height:1;outline:none;border:0}
.hoja .seal.small b{font-family:"Dancing Script",cursive;font-size:1.9rem}
.hoja .seal.small small{font-family:"Zilla Slab",serif;font-size:.58rem;letter-spacing:.2em;text-transform:uppercase}
.hoja-t{font-family:"Zilla Slab",serif;font-size:1.5rem;font-weight:600;color:#7B1828}
.hoja-d{color:#76605D;font-size:.95rem}
.hoja-cat{margin-top:14px;break-inside:avoid}
.hoja-cat h4{font-family:"Zilla Slab",serif;font-size:1.05rem;color:#A3263A;margin:0 0 4px;text-transform:uppercase;letter-spacing:.08em}
.hoja-row{display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:1.02rem}
.hoja-row i{color:#76605D;font-size:.85rem}
.hoja-row b{font-variant-numeric:tabular-nums}
.lead-dots{flex:1;border-bottom:1.5px dotted #CDB9A0;transform:translateY(-4px)}
.hoja-nota{margin:16px 0 0;font-style:italic;color:#5a4645}
.hoja-f{margin-top:18px;padding-top:10px;border-top:1px solid #E8DAC5;font-size:.8rem;color:#76605D;text-align:center}
@media print{body{background:#fff !important}body *{visibility:hidden}#hoja-slot,#hoja-slot *{visibility:visible}#hoja-slot{position:absolute;left:0;top:0;width:100%}.hoja{box-shadow:none;border:0;max-width:none}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.hist-day{font-family:var(--f-head);font-weight:600;padding:10px 12px;background:var(--cream)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

<header class="top">
  <div class="top-in">
    <div class="seal" aria-label="Chialli, libre de gluten"><b>Chialli</b><small>Libre de gluten</small></div>
    <div class="top-meta"><div class="t">Recetas y costos</div><div class="s">Sierra de la Ventana</div></div>
    <span class="chip-store" id="store-chip">Conectando…</span>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>
<main id="view"></main>
<div id="modal"></div>
<div id="toast-slot"></div>

<script>
"use strict";
/* ====================== Utilidades ====================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtMoney = n => { if (n == null || !isFinite(n)) return "—"; const big = Math.abs(n) >= 1000; return (S.cfg.moneda || "$") + " " + n.toLocaleString("es-AR", { minimumFractionDigits: !big && n % 1 ? 2 : 0, maximumFractionDigits: big ? 0 : 2 }); };
const fmtNum = (n, d = 2) => (n == null || !isFinite(n)) ? "—" : n.toLocaleString("es-AR", { maximumFractionDigits: d });
const fmtPct = n => (n > 0 ? "+" : "") + fmtNum(n, 1) + "%";
function parseNum(s) {
  if (typeof s === "number") return s;
  s = String(s ?? "").trim().replace(/\s/g, "").replace(/^\$/, "");
  if (!s) return NaN;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  return parseFloat(s);
}
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9ñ ]+/g, " ").replace(/\s+/g, " ").trim();
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString("es-AR", { day: "numeric", month: "short", year: "numeric" }); } catch { return ""; } };
const fmtTime = iso => { try { return new Date(iso).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }); } catch { return ""; } };

/* Unidades: masa y volumen se tratan como equivalentes (1 g ≈ 1 ml). */
const UNITS = {
  kg: { dim: "m", f: 1000, label: "kg" }, g: { dim: "m", f: 1, label: "g" },
  l: { dim: "m", f: 1000, label: "litro" }, ml: { dim: "m", f: 1, label: "ml" },
  u: { dim: "u", f: 1, label: "unidad" }, doc: { dim: "u", f: 12, label: "docena" },
  cda: { dim: "m", f: 15, label: "cucharada" }, cdta: { dim: "m", f: 5, label: "cucharadita" }, taza: { dim: "m", f: 240, label: "taza" },
};
const plural = (l, q) => q !== 1 && /^(litro|unidad|docena)$/.test(l) ? (l === "unidad" ? "unidades" : l + "s") : l;
const BUY_UNITS = ["kg", "g", "l", "ml", "u", "doc"];
const USE_UNITS = ["g", "kg", "ml", "l", "u", "cda", "cdta", "taza"];
const costLabel = ing => UNITS[ing.unidad]?.dim === "u" ? "por unidad" : (ing.unidad === "l" || ing.unidad === "ml" ? "por litro" : "por kg");

/* ====================== Estado y guardado ====================== */
const S = { mode: "init", ing: {}, rec: {}, prov: {}, hist: [], cfg: { margen: 120, redondeo: 50, moneda: "$", iva: 21, gastos: [], unidadesMes: "" } };
const DEFAULT_CFG = { margen: 120, redondeo: 50, moneda: "$", iva: 21, gastos: [], unidadesMes: "" };
const ui = { gastos: [], tab: "productos", qIng: "", catIng: "", sel: new Set(), bulkMode: "pct", bulkVal: "", preview: null, qRec: "", catRec: "", drafts: null, importMsg: "" };
try { const t = localStorage.getItem("chialli-tab"); if (t) ui.tab = t; } catch {}
let db = null;
const LS_KEY = "chialli-panel-v1";

function lsLoad() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (d) { S.ing = d.ing || {}; S.rec = d.rec || {}; S.prov = d.prov || {}; S.hist = d.hist || []; S.cfg = { ...DEFAULT_CFG, ...(d.cfg || {}) }; }
  } catch {}
}
function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify({ ing: S.ing, rec: S.rec, prov: S.prov, hist: S.hist, cfg: S.cfg })); } catch {} }

async function put(col, id, data) {
  const map = col === "ingredientes" ? S.ing : col === "proveedores" ? S.prov : S.rec;
  map[id] = data;
  if (db) await db.collection(col).doc(id).set(data);
  else if (S.mode === "nube") nube.op({ op: "put", col, id, data });
  else lsSave();
}
async function del(col, id) {
  const map = col === "ingredientes" ? S.ing : col === "proveedores" ? S.prov : S.rec;
  delete map[id];
  if (db) await db.collection(col).doc(id).delete();
  else if (S.mode === "nube") nube.op({ op: "del", col, id });
  else lsSave();
}
async function addHist(entries) {
  // Un documento por actualización (puede contener varios cambios), para no crecer de a uno.
  if (!entries.length) return;
  const h = { id: uid(), fecha: new Date().toISOString(), cambios: entries };
  S.hist.unshift(h);
  if (db) await db.collection("historial").doc(h.id).set({ fecha: h.fecha, cambios: h.cambios });
  else if (S.mode === "nube") nube.op({ op: "put", col: "historial", id: h.id, data: { fecha: h.fecha, cambios: h.cambios } });
  else lsSave();
}
async function saveCfg(c) {
  S.cfg = { ...S.cfg, ...c };
  if (db) await db.doc("config/general").set(S.cfg);
  else if (S.mode === "nube") nube.op({ op: "put", col: "config", id: "general", data: S.cfg });
  else lsSave();
}

let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return; renderQueued = true;

async function initStore() {
  let api = null;
  if (window.claude && typeof window.claude.use === "function") {
    try { api = await window.claude.use("db"); } catch { api = null; }
  }
  if (api) {
    db = api; S.mode = "db";
    const fail = e => { if (e && e.code === "revoked") { S.mode = "readonly"; render(); } };
    db.collection("ingredientes").onSnapshot(s => { const m = {}; s.docs.forEach(d => m[d.id] = d.data()); S.ing = m; scheduleRender(); }, fail);
    db.collection("proveedores").onSnapshot(s => { const m = {}; s.docs.forEach(d => m[d.id] = d.data()); S.prov = m; scheduleRender(); }, fail);
    db.collection("recetas").onSnapshot(s => { const m = {}; s.docs.forEach(d => m[d.id] = d.data()); S.rec = m; scheduleRender(); }, fail);
    db.collection("historial").orderBy("fecha", "desc").limit(150).onSnapshot(s => { S.hist = s.docs.map(d => ({ id: d.id, ...d.data() })); scheduleRender(); }, fail);
    db.doc("config/general").onSnapshot(s => { S.cfg = { ...DEFAULT_CFG, ...(s.exists ? s.data() : {}) }; scheduleRender(); }, fail);
  } else if (nube.url) {
    await nube.start(); return;
  } else {
    S.mode = "local"; lsLoad();
    let seeded = false; try { seeded = !!localStorage.getItem("chialli-seeded"); } catch {}
    if (!seeded && !Object.keys(S.ing).length && !Object.keys(S.rec).length) { await seed(true); toast("Te dejé productos de ejemplo cargados para probar. Los borrás desde Ajustes."); }
    else await upgradeExamples();
  }
  render();
}

/* ====================== Cálculos ====================== */
function unitCost(ing) {
  // costo por unidad base (g/ml o unidad)
  const u = UNITS[ing?.unidad]; const q = parseNum(ing?.cantidad); const p = parseNum(ing?.precio);
  if (!u || !(q > 0) || !(p >= 0)) return NaN;
  return p / (q * u.f);
}
function itemCalc(it, getIng) {
  const ing = getIng(it.ingId);
  if (!ing) return { cost: 0, err: "Ingrediente borrado" };
  const qty = parseNum(it.cantidad);
  if (!(qty > 0)) return { cost: 0, info: "sin cantidad" };
  const uu = UNITS[it.unidad], bu = UNITS[ing.unidad];
  if (!uu || !bu) return { cost: 0, err: "Unidad desconocida" };
  if (uu.dim !== bu.dim) return { cost: 0, err: `Se compra por ${bu.label}, se usa en ${uu.label}` };
  if (!(parseNum(ing.precio) > 0)) return { cost: 0, warn: "Sin precio" };
  return { cost: qty * uu.f * unitCost(ing) };
}
function gastosMes() { return (S.cfg.gastos || []).reduce((a, g) => a + (parseNum(g.monto) || 0), 0); }
function gastoLocalU() { const u = parseNum(S.cfg.unidadesMes); return u > 0 ? gastosMes() / u : 0; }
const SHORT = { kg: "kg", g: "g", l: "l", ml: "ml", u: "u.", doc: "doc." };
const hasStock = i => i && i.stock !== undefined && i.stock !== "" && isFinite(parseNum(i.stock));
function stockState(i) {
  if (!hasStock(i)) return null; const st = parseNum(i.stock), mn = parseNum(i.stockMinimo);
  if (st <= 0) return "agotado"; if (mn > 0 && st <= mn) return "bajo"; return "ok";
}
const lowStock = () => Object.entries(S.ing).filter(([, i]) => ["agotado", "bajo"].includes(stockState(i))).sort(sortByName);
function tandasPosibles(r) {
  // Cuántas veces se puede hacer la receta con el stock actual (solo ingredientes con stock cargado)
  let min = Infinity;
  (r.items || []).forEach(it => { const ing = S.ing[it.ingId]; const q = parseNum(it.cantidad); const uu = UNITS[it.unidad], bu = UNITS[ing?.unidad];
    if (!hasStock(ing) || !(q > 0) || !uu || !bu || uu.dim !== bu.dim) return;
    min = Math.min(min, Math.floor((parseNum(ing.stock) * bu.f) / (q * uu.f) + 1e-9)); });
  return min === Infinity ? null : Math.max(0, min);
}
function stockAlert() {
  const low = lowStock(); if (!low.length) return "";
  const porProv = {}; low.forEach(([, i]) => { const k = i.proveedor || "Sin proveedor"; (porProv[k] ||= []).push(i.nombre); });
  return `<div class="alert" role="alert"><div class="row" style="gap:8px"><b>Te estás quedando sin stock de ${low.length} ingrediente${low.length > 1 ? "s" : ""}</b><span class="spacer"></span><button class="btn sm" data-act="ver-bajo">Ver stock bajo</button><button class="btn sm pri" data-act="tab" data-k="pedidos">Armar pedidos</button></div>
    <div class="alert-list">${low.map(([, i]) => `<span class="pill ${stockState(i) === "agotado" ? "bad" : "warn"}">${esc(i.nombre)}: ${stockState(i) === "agotado" ? "agotado" : `quedan ${fmtNum(parseNum(i.stock))} ${SHORT[i.unidad] || ""}`}</span>`).join("")}</div>
    <div class="sub">Pedir a: ${Object.entries(porProv).map(([p, l]) => `<b>${esc(p)}</b> (${esc(l.join(", "))})`).join(" · ")}</div></div>`;
}
function roundPrice(x) { const r = parseNum(S.cfg.redondeo) || 0; return r > 0 ? Math.ceil(x / r) * r : Math.round(x * 100) / 100; }
function recCalc(r, overrides) {
  const getIng = id => (overrides && overrides[id]) || S.ing[id];
  let ingCost = 0; const issues = [];
  (r.items || []).forEach(it => { const c = itemCalc(it, getIng); ingCost += c.cost || 0; if (c.err) issues.push({ lvl: "bad", t: c.err }); if (c.warn) issues.push({ lvl: "warn", t: (getIng(it.ingId)?.nombre || "") + ": sin precio" }); });
  const extras = (r.extras || []).reduce((a, e) => a + (parseNum(e.monto) || 0), 0);
  const total = ingCost + extras;
  const rinde = parseNum(r.rinde) > 0 ? parseNum(r.rinde) : 1;
  const costoReceta = total / rinde;
  const gastoU = r.sinGastos ? 0 : gastoLocalU();
  const costoU = costoReceta + gastoU;
  const margen = parseNum(r.margen); const m = isFinite(margen) ? margen : parseNum(S.cfg.margen) || 0;
  const iva = Math.max(0, parseNum(S.cfg.iva) || 0);
  // El redondeo se aplica al precio final (el que ve el cliente); el precio sin IVA se deriva de él.
  const sugerido = total > 0 ? roundPrice(costoU * (1 + m / 100) * (1 + iva / 100)) : 0;
  const fijo = parseNum(r.precioFijo) > 0;
  const precio = fijo ? parseNum(r.precioFijo) : sugerido;
  const precioSinIva = precio / (1 + iva / 100);
  const margenReal = costoU > 0 ? (precioSinIva / costoU - 1) * 100 : 0;
  if (!(r.items || []).length) issues.push({ lvl: "warn", t: "Sin ingredientes" });
  return { ingCost, extras, total, rinde, costoReceta, gastoU, costoU, margen: m, iva, precio, sugerido, fijo, margenReal, precioSinIva, ivaMonto: precio - precioSinIva, ganancia: precioSinIva - costoU, issues };
}
function statusPill(c) {
  if (c.issues.some(i => i.lvl === "bad")) return `<span class="pill bad" title="${esc(c.issues.map(i => i.t).join(" · "))}">Revisar unidades</span>`;
  if (c.issues.length) return `<span class="pill warn" title="${esc(c.issues.map(i => i.t).join(" · "))}">${esc(c.issues[0].t.includes("sin precio") ? "Falta un precio" : c.issues[0].t)}</span>`;
  return `<span class="pill ok">Al día</span>`;
}
const recipesUsing = ids => Object.entries(S.rec).filter(([, r]) => (r.items || []).some(it => ids.has(it.ingId)));
const sortByName = (a, b) => (a[1].nombre || "").localeCompare(b[1].nombre || "", "es");

      ${affected.map(x => { const nuevo = keep ? x.a.precio : x.b.sugerido; const p = x.a.precio ? (nuevo - x.a.precio) / x.a.precio * 100 : 0; return `<tr><td class="name">${esc(x.r.nombre)}${x.r.precioFijo && !keep ? ` <span class="pill neu">deja de ser fijo</span>` : ""}</td><td class="r num">${fmtMoney(x.a.costoU)} → ${fmtMoney(x.b.costoU)}</td><td class="r num">${fmtMoney(x.a.precio)}</td><td class="r num"><b>${fmtMoney(keep ? x.a.precio : x.b.sugerido)}</b>${keep ? `<div class="sub">ganás ${fmtMoney(x.a.precio / (1 + x.a.iva / 100) - x.b.costoU)} (antes ${fmtMoney(x.a.precio / (1 + x.a.iva / 100) - x.a.costoU)})</div>` : ""}</td><td class="r num ${p > 0 ? "up" : p < 0 ? "down" : ""}">${fmtPct(p)}</td></tr>`; }).join("")}
    </tbody></table></div>` : `<p class="note">Ningún producto usa estos ingredientes todavía.</p>`}
  </div>
  <div class="md-f"><span class="note">Se guarda en el historial con la fecha de hoy.</span><span class="spacer"></span><button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="apply-preview">${keep ? "Aplicar costo y mantener precios" : `Aplicar ${ids.size > 1 ? `a ${ids.size} ingredientes` : "nuevo precio"}`}</button></div>`);
}
async function applyPrices(newPrices) {
  const now = new Date().toISOString(); const cambios = [];
  const ids = new Set(Object.keys(newPrices));
  const before = Object.fromEntries(recipesUsing(ids).map(([id, r]) => [id, recCalc(r).precio]));
  await Promise.all([...ids].map(id => { const i = S.ing[id]; const o = parseNum(i.precio) || 0; const n = Math.round(newPrices[id] * 100) / 100; if (o === n) return null; cambios.push({ ingId: id, nombre: i.nombre, antes: o, despues: n }); return put("ingredientes", id, { ...i, precio: n, actualizado: now }); }));
  await addHist(cambios);
  const changed = Object.entries(before).filter(([id, p]) => S.rec[id] && recCalc(S.rec[id]).precio !== p).length;
  toast(cambios.length ? `Listo: ${cambios.length} precio${cambios.length > 1 ? "s" : ""} actualizado${cambios.length > 1 ? "s" : ""}${changed ? `, ${changed} producto${changed > 1 ? "s" : ""} con precio nuevo` : ""}.` : "No había cambios para guardar.");
}

/* ---------- Pedidos a proveedores ---------- */
ui.pedido = {};
function sugerido(i) {
  // Paquetes a pedir para volver al doble del mínimo
  const st = parseNum(i.stock) || 0, mn = parseNum(i.stockMinimo) || 0, paq = parseNum(i.cantidad) || 1;
  if (!["bajo", "agotado"].includes(stockState(i))) return 0;
  return Math.max(1, Math.ceil((Math.max(mn * 2, mn + paq) - st) / paq));
}
const paquetes = id => ui.pedido[id] ?? sugerido(S.ing[id]);
const presentacion = i => `${fmtNum(parseNum(i.cantidad))} ${plural(UNITS[i.unidad]?.label || i.unidad, parseNum(i.cantidad))}`;
function pedidosPorProveedor() {
  const g = {};
  Object.entries(S.ing).sort(sortByName).forEach(([id, i]) => { const k = i.proveedor || ""; (g[k] ||= []).push([id, i]); });
  return Object.entries(g).map(([prov, items]) => ({ prov, p: Object.entries(S.prov).find(([, x]) => norm(x.nombre) === norm(prov)), items: items.sort((a, b) => (sugerido(b[1]) > 0) - (sugerido(a[1]) > 0) || a[1].nombre.localeCompare(b[1].nombre, "es")) }))
    .filter(x => x.items.some(([id]) => paquetes(id) > 0) || ui.pedidoAbierto === x.prov)
    .sort((a, b) => (a.prov ? 0 : 1) - (b.prov ? 0 : 1) || a.prov.localeCompare(b.prov, "es"));
}
function textoPedido(prov, p, items) {
  const lines = items.filter(([id]) => paquetes(id) > 0).map(([id, i]) => `• ${paquetes(id)} × ${i.nombre} (${presentacion(i)})`);
  const quien = p?.[1]?.contacto || "";
  return `Hola${quien ? " " + quien : ""}! Te paso el pedido para Chialli:\n\n${lines.join("\n")}\n\n¿Me confirmás precio y cuándo lo podés entregar? Gracias!`;
}
function waLink(tel, text) {
  let d = String(tel || "").replace(/\D/g, "");
  if (d && !d.startsWith("54")) d = "549" + d.replace(/^0/, "");
  return `https://wa.me/${d}?text=${encodeURIComponent(text)}`;
}
function viewPedidos() {
  const grupos = pedidosPorProveedor();

  if (!grupos.length) return head + `<div class="panel empty"><p>No hay nada para pedir: ningún ingrediente está por debajo del mínimo. Cargá el stock y el mínimo de cada ingrediente para que el panel te avise.</p><button class="btn" data-act="tab" data-k="ingredientes">Ir a Ingredientes</button></div>`;
  return head + grupos.map(({ prov, p, items }) => {
    const k = esc(prov); const total = items.reduce((a, [id, i]) => a + paquetes(id) * (parseNum(i.precio) || 0), 0);
    const n = items.filter(([id]) => paquetes(id) > 0).length; const tel = p?.[1]?.telefono;
    return `<div class="panel rubro">
      <div class="row"><h3>${prov ? k : "Sin proveedor asignado"}</h3>${p?.[1]?.telefono ? `<span class="sub">${esc(p[1].telefono)}</span>` : ""}${p?.[1]?.notas ? `<span class="sub">· ${esc(p[1].notas)}</span>` : ""}<span class="spacer"></span><span class="sub">${n} producto${n === 1 ? "" : "s"} · aprox. <b>${fmtMoney(total)}</b></span></div>
      <div class="tbl-wrap items"><table style="min-width:520px"><thead><tr><th>Ingrediente</th><th class="r">Stock</th><th class="r">Paquetes a pedir</th><th class="r">Subtotal</th></tr></thead><tbody>
      ${items.filter(([id]) => paquetes(id) > 0 || ui.pedidoAbierto === prov).map(([id, i]) => { const st = stockState(i); return `<tr class="${paquetes(id) > 0 ? "" : "dim"}"><td><div class="name">${esc(i.nombre)}</div><div class="sub">Paquete de ${presentacion(i)}</div></td>
        <td class="r num">${hasStock(i) ? `${fmtNum(parseNum(i.stock), 3)} ${SHORT[i.unidad] || ""}` : "—"}${st === "agotado" ? ` <span class="pill bad">Agotado</span>` : st === "bajo" ? ` <span class="pill warn">Bajo</span>` : ""}</td>
        <td class="r"><input class="in num" style="width:80px;text-align:right" data-pedido="${id}" inputmode="numeric" value="${paquetes(id) || ""}" placeholder="0" aria-label="Paquetes de ${esc(i.nombre)}"></td>
        <td class="r num">${paquetes(id) > 0 ? fmtMoney(paquetes(id) * (parseNum(i.precio) || 0)) : "—"}</td></tr>`; }).join("")}
      </tbody></table></div>
      ${items.some(([id]) => !(paquetes(id) > 0)) ? `<button class="btn sm" style="align-self:flex-start" data-act="pedido-mas" data-prov="${k}">${ui.pedidoAbierto === prov ? "Mostrar solo lo que falta" : "Agregar otros productos de este proveedor"}</button>` : ""}
      ${n ? `<details><summary class="note">Ver el mensaje</summary><pre class="msg">${esc(textoPedido(prov, p, items))}</pre></details>` : ""}
      <div class="row">${n ? `<a class="btn pri" href="${esc(waLink(tel, textoPedido(prov, p, items)))}" target="_blank" rel="noopener">Enviar por WhatsApp</a><button class="btn" data-act="copiar-pedido" data-prov="${k}">Copiar mensaje</button>` : ""}<span class="spacer"></span>${n ? `<button class="btn" data-act="recibir" data-prov="${k}">Recibí el pedido</button>` : ""}</div>

    </div>`; }).join("");
}

// Los ejemplos cargados con una versión anterior del panel no tenían stock ni proveedores: se completan.
async function upgradeExamples() {
  const ej = Object.entries(S.ing).filter(([, i]) => i.ejemplo); if (!ej.length) return;
  const needs = ej.some(([, i]) => !hasStock(i) || !i.proveedor) || !Object.values(S.prov).some(p => p.ejemplo);
  if (!needs) return;
  await seed(true);
  const provDe = cat => (SEED_P.find(p => p[1].includes(cat)) || [""])[0];
  for (const [id, i] of Object.entries(S.ing)) {
    if (!i.ejemplo) continue; const def = SEED_I.find(x => x[0] === i.nombre); const upd = { ...i };
    if (!hasStock(i)) { const [st, mn] = SEED_STOCK[i.nombre] || [(def ? def[2] : 1) * 3, def ? def[2] : 1]; upd.stock = st; upd.stockMinimo = mn; }
    if (!i.proveedor) upd.proveedor = provDe(i.categoria);
    await put("ingredientes", id, upd);
  }
}
async function seed(silent) {
  const now = new Date().toISOString();
  const ids = {};
  Object.entries(S.ing).forEach(([id, i]) => { if (i.ejemplo) ids[i.nombre] = id; });
  const provDe = cat => (SEED_P.find(p => p[1].includes(cat)) || [""])[0];
  const haveP = new Set(Object.values(S.prov).map(p => norm(p.nombre)));
  for (const [nombre, rubros, notas] of SEED_P) if (!haveP.has(norm(nombre))) await put("proveedores", uid(), { nombre, rubros, contacto: "", telefono: "", email: "", notas, ejemplo: true });
  for (const [nombre, categoria, cantidad, unidad, precio] of SEED_I) { if (ids[nombre]) continue; const id = uid(); ids[nombre] = id; const [stock, stockMinimo] = SEED_STOCK[nombre] || [cantidad * 3, cantidad]; await put("ingredientes", id, { nombre, categoria, proveedor: provDe(categoria), cantidad, unidad, precio, stock, stockMinimo, ejemplo: true, creado: now }); }
  const have = new Set(Object.values(S.rec).filter(r => r.ejemplo).map(r => r.nombre));
  for (const [nombre, categoria, rinde, unidadRinde, margen, items, extras] of SEED_R) {
    if (have.has(nombre)) continue;
    await put("recetas", uid(), { nombre, categoria, rinde, unidadRinde, margen, items: items.map(([n, c, u]) => ({ ingId: ids[n], cantidad: c, unidad: u })), extras: extras.map(([n, m]) => ({ nombre: n, monto: m })), notas: "", ejemplo: true });
  }
  try { localStorage.setItem("chialli-seeded", "1"); } catch {}
  render(); if (!silent) toast(`Cargué ${SEED_I.length} ingredientes y ${SEED_R.length} recetas de ejemplo. Los precios son de muestra.`);
}

  else if (t.name === "pmode" && ui.preview) { ui.preview.mode = t.value; openPreview(ui.preview.newPrices, ui.preview.title); }
  else if (t.id === "r-gastos") updRecCalc();
  else if (t.dataset.item != null && t.tagName === "SELECT") { const it = recDraft.items[+t.dataset.item]; it[t.dataset.f] = t.value; if (t.dataset.f === "ingId" && S.ing[t.value]) { const dim = UNITS[S.ing[t.value].unidad].dim; if (UNITS[it.unidad].dim !== dim) it.unidad = dim === "u" ? "u" : "g"; } readRecHead(); renderItems(); updRecCalc(); }
  else if (t.dataset.draft != null && t.dataset.f === "incluir") { ui.drafts[+t.dataset.draft].incluir = t.checked; render(); }
  else if (t.dataset.di) { const [k, j] = t.dataset.di.split(":").map(Number); const it = ui.drafts[k].items[j]; if (t.dataset.f === "unidad") it.unidad = t.value; if (t.dataset.f === "match") { it.match = t.value; render(); } }
  else if (t.dataset.act === "stock") {
    const id = t.dataset.id, i = S.ing[id]; const raw = t.value.trim();
    const v = raw === "" ? "" : Math.max(0, parseNum(raw)); if (raw !== "" && !isFinite(v)) { t.value = hasStock(i) ? fmtNum(parseNum(i.stock), 3) : ""; return; }
    put("ingredientes", id, { ...i, stock: v }).then(() => { render(); const st = stockState(S.ing[id]); if (st === "bajo" || st === "agotado") toast(`${i.nombre}: ${st === "agotado" ? "agotado" : "stock bajo"}. ${i.proveedor ? `Pedile a ${i.proveedor}.` : ""}`); });
  }
  else if (t.dataset.act === "price") {
    const id = t.dataset.id, i = S.ing[id]; const v = parseNum(t.value); const o = parseNum(i.precio) || 0;
    if (t.value.trim() === "" || !isFinite(v) || v < 0 || v === o) { t.value = o > 0 ? fmtNum(o) : ""; return; }
    const affected = recipesUsing(new Set([id])).length;
    if (affected) { t.value = o > 0 ? fmtNum(o) : ""; openPreview({ [id]: v }, `Nuevo precio de ${i.nombre}`); }
    else applyPrices({ [id]: v }).then(() => renderIngRows());
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#modal").innerHTML) closeModal();
  if (e.key === "Enter" && (e.target.dataset?.act === "price" || e.target.dataset?.act === "stock")) e.target.blur();
  if (e.key === "Enter" && e.target.id === "bulk-val") { e.preventDefault(); $('[data-act="bulk-preview"]')?.click(); }
});
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "prov-form") {
    const nombre = $("#p-nombre").value.trim(); if (!nombre) return;
    const id = provDraft.id || uid(); const prev = S.prov[id] || {};
    const data = { ...prev, nombre, contacto: $("#p-contacto").value.trim(), telefono: $("#p-tel").value.trim(), email: $("#p-mail").value.trim(), notas: $("#p-notas").value, rubros: [...document.querySelectorAll("#p-rubros input:checked")].map(x => x.value), actualizado: new Date().toISOString() };
    if (prev.nombre && norm(prev.nombre) !== norm(nombre)) for (const [iid, i] of Object.entries(S.ing)) if (norm(i.proveedor) === norm(prev.nombre)) await put("ingredientes", iid, { ...i, proveedor: nombre });
    await put("proveedores", id, data); closeModal(); toast(provDraft?.id ? "Proveedor guardado." : `Agregué «${nombre}».`); return;
  }
  if (e.target.id === "ing-form") {
    const d = readIng(); if (!d.nombre) return;
    if (!(d.cantidad > 0)) { toast("Indicá de cuánto es el paquete, por ejemplo 1 kg o 30 unidades."); return; }
    const id = ingDraft.id || uid(); const prev = S.ing[id] || {}; const o = parseNum(prev.precio) || 0;
    const rec = { ...prev, ...d, actualizado: new Date().toISOString() };
    if (ingDraft.id && o !== d.precio) { await put("ingredientes", id, { ...rec, precio: o }); closeModal(); if (recipesUsing(new Set([id])).length) openPreview({ [id]: d.precio }, `Nuevo precio de ${d.nombre}`); else { await applyPrices({ [id]: d.precio }); render(); } return; }
    await put("ingredientes", id, rec); closeModal(); toast(ingDraft?.id ? "Ingrediente guardado." : `Agregué «${d.nombre}».`);
  }
  if (e.target.id === "rec-form") {
    readRecHead(); if (!recDraft.nombre) return;
    const id = recDraft.id || uid(); const { id: _, ...data } = recDraft;
    data.items = data.items.filter(i => i.ingId).map(i => ({ ingId: i.ingId, cantidad: parseNum(i.cantidad) || 0, unidad: i.unidad }));
    data.extras = (data.extras || []).filter(x => x.nombre || parseNum(x.monto)).map(x => ({ nombre: x.nombre, monto: parseNum(x.monto) || 0 }));
    data.actualizado = new Date().toISOString();
    await put("recetas", id, data); closeModal(); toast(`Guardé «${data.nombre}». Precio de venta: ${fmtMoney(recCalc(data).precio)}.`);
  }
});
// Arrastrar y soltar el Word
document.addEventListener("dragover", e => { const d = e.target.closest?.("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest?.("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest?.("#drop"); if (d) { e.preventDefault(); d.classList.remove("over"); handleDocx(e.dataTransfer.files[0]); } });

render();
initStore();
</script>
